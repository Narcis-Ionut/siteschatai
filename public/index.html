<!doctype html>
<html lang="ro">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Asistent AI pentru IPTV Romania. Intrebari despre pachete, canale, compatibilitate si suport IP-TV.RO."
		/>
		<title>IP-TV.RO Asistent AI</title>
		<style>
			:root {
				--primary: #01388a;
				--secondary: #fcd116;
				--accent: #ce1126;
				--light: #f8f9fa;
				--dark: #1f2937;
				--gray: #6c757d;
				--panel: #ffffff;
				--panel-soft: #f3f6fb;
				--border: #e2e8f0;
				--shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			}

			body {
				min-height: 100vh;
				background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
				color: var(--dark);
				display: flex;
				justify-content: flex-start;
				align-items: stretch;
			}

			.app-shell {
				width: 100%;
				max-width: 520px;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				gap: 16px;
				padding: 18px 18px 24px;
			}

			.app-header {
				background: linear-gradient(135deg, var(--primary) 0%, #00205b 100%);
				color: #fff;
				border-radius: 16px;
				padding: 18px 20px;
				box-shadow: var(--shadow);
			}

			.brand-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
			}

			.brand-title {
				font-size: 1.6rem;
				font-weight: 700;
				letter-spacing: 0.2px;
			}

			.brand-title span {
				color: var(--secondary);
			}

			.brand-sub {
				margin-top: 6px;
				font-size: 0.95rem;
				color: rgba(255, 255, 255, 0.82);
			}

			.status-pill {
				background: var(--secondary);
				color: var(--primary);
				padding: 6px 12px;
				border-radius: 999px;
				font-size: 0.7rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.app-main {
				flex: 1;
				display: flex;
			}

			.chat-card {
				flex: 1;
				background: var(--panel);
				border-radius: 18px;
				border: 1px solid rgba(1, 56, 138, 0.1);
				box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
				overflow: hidden;
				display: flex;
				flex-direction: column;
				min-height: 520px;
			}

			.chat-toolbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 12px 16px;
				background: #f8fafc;
				border-bottom: 1px solid var(--border);
				font-size: 0.9rem;
				color: #425466;
			}

			.chat-tag {
				background: rgba(1, 56, 138, 0.08);
				color: var(--primary);
				padding: 4px 10px;
				border-radius: 999px;
				font-size: 0.75rem;
				font-weight: 600;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 16px;
				background: var(--panel-soft);
				display: flex;
				flex-direction: column;
				gap: 12px;
			}

			.message {
				padding: 12px 14px;
				border-radius: 14px;
				max-width: 85%;
				box-shadow: 0 8px 16px rgba(15, 23, 42, 0.08);
			}

			.message p {
				margin: 0;
				white-space: pre-line;
				overflow-wrap: anywhere;
			}

			.user-message {
				align-self: flex-end;
				margin-left: auto;
				background: rgba(252, 209, 22, 0.22);
				border: 1px solid rgba(252, 209, 22, 0.5);
			}

			.assistant-message {
				align-self: flex-start;
				background: #fff;
				border: 1px solid rgba(1, 56, 138, 0.12);
			}

			.typing-indicator {
				display: none;
				padding: 12px 16px;
				color: var(--gray);
				background: #fff;
				border-top: 1px solid var(--border);
				font-style: italic;
			}

			.typing-indicator.visible {
				display: block;
			}

			.message-input {
				display: flex;
				gap: 10px;
				padding: 14px 16px;
				background: #fff;
				border-top: 1px solid var(--border);
			}

			#user-input {
				flex: 1;
				padding: 12px 14px;
				border: 1px solid #d7dde6;
				border-radius: 10px;
				background: #f8fafc;
				resize: none;
				min-height: 46px;
				font-size: 0.95rem;
			}

			#user-input:focus {
				outline: 2px solid rgba(1, 56, 138, 0.2);
				border-color: rgba(1, 56, 138, 0.6);
				background: #fff;
			}

			#send-button {
				padding: 0 22px;
				background: var(--secondary);
				color: var(--primary);
				border: none;
				border-radius: 999px;
				font-weight: 700;
				font-size: 0.95rem;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
				box-shadow: 0 10px 18px rgba(15, 23, 42, 0.18);
			}

			#send-button:hover {
				background: #ffdf4d;
				transform: translateY(-1px);
			}

			#send-button:disabled {
				background: #d0d5dd;
				color: var(--gray);
				cursor: not-allowed;
				box-shadow: none;
				transform: none;
			}

			.app-footer {
				text-align: left;
				font-size: 0.85rem;
				color: var(--gray);
				padding: 0 4px;
			}

			@media (max-width: 640px) {
				.app-shell {
					padding: 14px;
				}

				.brand-row {
					flex-direction: column;
					align-items: flex-start;
				}

				.chat-card {
					min-height: 60vh;
				}

				.message-input {
					flex-direction: column;
					align-items: stretch;
				}

				#send-button {
					width: 100%;
					padding: 12px 16px;
				}
			}
		</style>
	</head>
	<body>
		<div class="app-shell">
			<header class="app-header">
				<div class="brand-row">
					<div>
						<h1 class="brand-title">IP-TV<span>.RO</span> Asistent</h1>
						<p class="brand-sub">
							Chat AI pentru IPTV Romania si diaspora
						</p>
					</div>
					<span class="status-pill">Online</span>
				</div>
			</header>

			<main class="app-main">
				<div class="chat-card">
					<div class="chat-toolbar">
						<span>Asistent AI IP-TV.RO</span>
						<span class="chat-tag">Raspuns rapid</span>
					</div>
					<div id="chat-messages" class="chat-messages">
						<div class="message assistant-message">
							<p>
								Salut! Sunt asistentul IP-TV.RO. Pot ajuta cu intrebari despre
								IPTV Romania, pachete, compatibilitate si suport.
							</p>
						</div>
					</div>

					<div class="typing-indicator" id="typing-indicator">
						Asistentul AI pregateste un raspuns...
					</div>

					<div class="message-input">
						<textarea
							id="user-input"
							placeholder="Scrie mesajul aici..."
							rows="1"
							autofocus
						></textarea>
						<button id="send-button">Trimite</button>
					</div>
				</div>
			</main>

			<footer class="app-footer">
				<p>IP-TV.RO Asistent AI &copy; 2026</p>
			</footer>
		</div>

		<script src="chat.js"></script>
	</body>
</html>
